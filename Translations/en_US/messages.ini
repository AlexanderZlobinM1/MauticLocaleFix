mautic.integration.mauticlocalefix.description="Regional UI settings for Mautic without core patches."
mautic.integration.mauticlocalefix.calendar_enabled="Enable calendar regional fix"
mautic.integration.mauticlocalefix.calendar_enabled.tooltip="Applies selected regional calendar settings to Mautic date pickers without changing Mautic core files."
mautic.integration.mauticlocalefix.calendar_week_start="Calendar week start"
mautic.integration.mauticlocalefix.calendar_week_start.tooltip="Controls the first day of the week in Mautic calendar popups."
mautic.integration.mauticlocalefix.calendar_date_format="Calendar date format"
mautic.integration.mauticlocalefix.calendar_date_format.tooltip="Controls date display only for fields explicitly marked for Mautic Locale Fix formatting; normal datepicker fields keep their native value format."
mautic.integration.mauticlocalefix.time_display_format="Time display format in tables and charts"
mautic.integration.mauticlocalefix.time_display_format.tooltip="Formats times in timestamp/time table columns and chart labels without changing saved values."
