mautic.integration.mauticlocalefix.campaign_datetime_utc_submit.tooltip="Submits campaign event dates entered in the Mautic timezone as UTC so Mautic stores and displays the selected local time."
mautic.integration.mauticlocalefix.gmail_image_proxy_open="Count Gmail image proxy opens"
